<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>游戏 | Games | Qcy's Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-gradient {
            background: linear-gradient(-45deg, #6a11cb, #2575fc, #ff00cc, #333399);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .glass-panel {
            background: rgba(20, 20, 35, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
        }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border-color: #6a11cb;
        }

        .btn-animate {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .btn-animate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .btn-animate:hover::before {
            left: 100%;
        }

        .btn-animate:active {
            transform: scale(0.95);
        }

        ::selection {
            background-color: #3b82f6;
            color: white;
        }
        ::-moz-selection {
            background-color: #3b82f6;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .game-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="animate-gradient min-h-screen font-sans text-gray-800 selection:bg-blue-500 selection:text-white">

    <nav class="fixed top-0 w-full z-50 glass-panel px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-gamepad text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500 text-3xl drop-shadow-sm"></i>
            <span class="text-white font-bold text-xl tracking-wider drop-shadow-md">游戏 | Games</span>
        </div>
        <div class="flex items-center gap-4">
            <a href="#" class="hidden md:block text-white/80 hover:text-white transition-colors text-sm font-medium">关于</a>
            <a href="https://www.qcyblog.dpdns.org" class="btn-animate bg-white/10 hover:bg-white/20 text-white px-5 py-2 rounded-full font-medium border border-white/20 transition-all flex items-center gap-2 shadow-lg backdrop-blur-sm">
                <i class="fa-solid fa-house"></i>
                返回主站
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-28 pb-12 relative z-10">
        
        <div class="text-center mb-12 relative">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
            
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 drop-shadow-lg tracking-tight relative z-10">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-blue-200">Qcy的自制游戏</span>
            </h1>
            <p class="text-blue-100 text-base mb-8 max-w-2xl mx-auto font-light relative z-10">
                探索独立开发者的奇思妙想，体验独一无二的游戏世界
            </p>
            
            <div class="max-w-xl mx-auto relative group z-10">
                <div class="absolute -inset-1 bg-gradient-to-r from-pink-600 to-purple-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                <input type="text" id="searchInput" placeholder="搜索游戏名称、类型或开发者..." 
                    class="relative w-full px-6 py-3.5 rounded-full bg-white/95 backdrop-blur shadow-xl focus:outline-none focus:ring-4 focus:ring-purple-500/30 text-gray-700 placeholder-gray-400 transition-all pl-12 text-sm">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            </div>
        </div>

        <div class="flex justify-center flex-wrap gap-2 mb-10 relative z-10" id="categoryFilters">
            <button class="filter-btn active px-4 py-1.5 rounded-full bg-white text-purple-700 font-semibold shadow-md transition-all hover:scale-105 text-sm" data-category="all">全部</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-white/20 text-white font-medium border border-white/30 hover:bg-white/30 transition-all hover:scale-105 backdrop-blur-sm text-sm" data-category="action">动作冒险</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-white/20 text-white font-medium border border-white/30 hover:bg-white/30 transition-all hover:scale-105 backdrop-blur-sm text-sm" data-category="puzzle">益智解谜</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-white/20 text-white font-medium border border-white/30 hover:bg-white/30 transition-all hover:scale-105 backdrop-blur-sm text-sm" data-category="rpg">角色扮演</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-white/20 text-white font-medium border border-white/30 hover:bg-white/30 transition-all hover:scale-105 backdrop-blur-sm text-sm" data-category="simulation">模拟经营</button>
        </div>

        <div id="gameList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        </div>

        <div id="emptyState" class="hidden text-center py-20">
            <div class="inline-block p-6 rounded-full bg-white/10 backdrop-blur mb-4">
                <i class="fa-solid fa-ghost text-6xl text-white/70"></i>
            </div>
            <p class="text-white text-xl font-medium">未找到相关游戏</p>
            <p class="text-white/60 mt-2">试试其他关键词或分类吧</p>
        </div>
    </main>

    <footer class="glass-panel mt-12 py-8 text-center relative z-10">
        <div class="flex justify-center space-x-6 mb-4">
            <a href="#" class="text-white/60 hover:text-white transition-colors"><i class="fa-brands fa-github text-xl"></i></a>
        </div>
        <p class="text-white/40 text-sm">&copy; Games | Qcy's Blog</p>
    </footer>

    <script>
        const games = [
            {
                id: 1,
                title: "大地图跑酷模拟器",
                description: "一款使用 TurboWarp物理引擎 制作的小游戏，模拟了经典的跑酷游戏",
                category: "action",
                tags: ["Scratch", "TurboWarp", "Parkour"],
                rating: 5,
                downloads: 0,
                image: "/#",
                developer: "QcyStudio"
            },

        ];

        function renderGames(data) {
            const container = document.getElementById('gameList');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl overflow-hidden flex flex-col h-full relative group';

                const tagsHtml = item.tags.map(tag => 
                    `<span class="game-tag">${tag}</span>`
                ).join('');

                let starsHtml = '';
                for(let i=1; i<=5; i++) {
                    if(i <= Math.floor(item.rating)) {
                        starsHtml += '<i class="fa-solid fa-star text-yellow-400 text-xs"></i>';
                    } else if (i === Math.ceil(item.rating) && !Number.isInteger(item.rating)) {
                        starsHtml += '<i class="fa-solid fa-star-half-stroke text-yellow-400 text-xs"></i>';
                    } else {
                        starsHtml += '<i class="fa-regular fa-star text-gray-300 text-xs"></i>';
                    }
                }

                card.innerHTML = `
                    <div class="relative h-36 overflow-hidden"> 
                        <img src="${item.image}" alt="${item.title} 游戏截图" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-[10px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wide">
                            ${item.category}
                        </div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center pb-3">
                             <button onclick="playDemo(${item.id})" class="btn-animate bg-white text-purple-700 px-4 py-1.5 rounded-full font-bold shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 text-xs flex items-center gap-1">
                                <i class="fa-solid fa-play"></i> 试玩
                             </button>
                        </div>
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-base font-bold text-gray-800 group-hover:text-purple-700 transition-colors line-clamp-1">${item.title}</h3>
                            <div class="flex items-center bg-gray-100 px-1.5 py-0.5 rounded-md shrink-0 ml-2">
                                ${starsHtml}
                                <span class="text-[10px] text-gray-500 ml-1 font-medium">${item.rating}</span>
                            </div>
                        </div>
                        
                        <p class="text-gray-500 text-xs mb-3 flex-grow line-clamp-2 leading-relaxed">${item.description}</p>
                        
                        <div class="flex flex-wrap gap-1.5 mb-3">
                            ${tagsHtml}
                        </div>
                        
                        <div class="border-t border-gray-100 pt-3 flex items-center justify-between mt-auto">
                            <div class="text-[10px] text-gray-400 flex flex-col">
                                <span class="font-medium text-gray-600">${item.developer}</span>
                                <span class="mt-0.5 flex items-center"><i class="fa-solid fa-download mr-1 text-[8px]"> ${item.downloads.toLocaleString()}
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="viewDetails(${item.id})" class="btn-animate px-3 py-1.5 rounded-lg text-xs font-medium text-purple-600 bg-purple-50 hover:bg-purple-100 transition-colors">
                                    详情
                                </button>
                                <button onclick="downloadGame(${item.id})" class="btn-animate px-3 py-1.5 rounded-lg text-xs font-medium text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 shadow-md hover:shadow-lg transition-all">
                                    下载
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = games.filter(item => 
                item.title.toLowerCase().includes(keyword) || 
                item.description.toLowerCase().includes(keyword) ||
                item.tags.some(tag => tag.toLowerCase().includes(keyword)) ||
                item.developer.toLowerCase().includes(keyword)
            );
            renderGames(filtered);
        });

        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-white', 'text-purple-700', 'shadow-md');
                    b.classList.add('bg-white/20', 'text-white', 'border', 'border-white/30');
                });
                btn.classList.remove('bg-white/20', 'text-white', 'border', 'border-white/30');
                btn.classList.add('bg-white', 'text-purple-700', 'shadow-md');

                const category = btn.getAttribute('data-category');
                if (category === 'all') {
                    renderGames(games);
                } else {
                    const filtered = games.filter(item => item.category === category);
                    renderGames(filtered);
                }
            });
        });

        window.viewDetails = function(id) {
            const item = games.find(s => s.id === id);
            alert(`查看游戏详情: ${item.title}\n开发者: ${item.developer}\n\n(实际项目中此处应跳转至详情页)`);
        };

        window.playDemo = function(id) {
            const item = games.find(s => s.id === id);
            alert(`正在加载 WebGL 试玩环境: ${item.title}...`);
        };

        window.downloadGame = function(id) {
            const item = games.find(s => s.id === id);
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600');
                    alert(`开始下载: ${item.title}_Installer.exe`);
                }, 1000);
            }, 800);
        };

        renderGames(games);
    </script>
</body>
</html>
